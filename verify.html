<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Verification</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- SweetAlert for nice loading animations -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .verify-container {
            max-width: 450px;
            margin: 50px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .verified-badge {
            color: #10b981;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .student-photo-large {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #10b981;
            margin: 0 auto 20px auto;
        }
        .details-box {
            text-align: left;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .details-box p {
            margin: 10px 0;
            font-size: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        .details-box p:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="verify-container" id="verify-box" style="display: none;">
        <div class="verified-badge">
            <svg width="30" height="30" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
            100% VERIFIED STUDENT
        </div>
        
        <img src="" id="v-photo" class="student-photo-large" alt="Student Photo">
        
        <h2 id="v-name" style="margin-bottom: 5px;">Student Name</h2>
        
        <div class="details-box">
            <p><span class="label">School/College:</span> <span id="v-school"></span></p>
            <p><span class="label">Father's Name:</span> <span id="v-father"></span></p>
            <p><span class="label">Mother's Name:</span> <span id="v-mother"></span></p>
            <p><span class="label">Course:</span> <span id="v-course"></span></p>
        </div>
    </div>

    <!-- Error message if student not found -->
    <div class="verify-container" id="error-box" style="display: none; color: #ef4444;">
        <h2 style="color: #ef4444;">❌ Verification Failed</h2>
        <p>No valid student record found for this QR code.</p>
    </div>

    <script type="module" src="js/verify.js"></script>
</body>
</html>

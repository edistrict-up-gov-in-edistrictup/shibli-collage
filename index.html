<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium College Portal Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Yahan Apna Background Image Set Karein */
        body.login-page {
            /* Apni background image ko images folder mein bg-image.jpg ke naam se save karein */
            background: url('images/bg-image.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        
        /* Premium Glassmorphism Effect */
        .auth-container {
            background: rgba(255, 255, 255, 0.85); /* Halka transparent */
            backdrop-filter: blur(12px); /* Sheeshe jaisa blur effect */
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin: auto;
        }

        /* Dark Mode Glassmorphism */
        .dark-mode .auth-container {
            background: rgba(31, 41, 55, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid var(--border);
        }

        .dark-mode .captcha-box {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="login-page">
    
    <!-- Theme Toggle Button -->
    <button class="theme-switch" onclick="toggleTheme()" style="position: absolute; top: 20px; right: 20px; z-index: 10;">🌓 Theme</button>
    
    <!-- LOGIN BOX -->
    <div class="auth-container" id="login-box">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="images/default-logo.png" alt="Logo" width="90" style="border-radius: 50%;">
        </div>
        <h2 style="text-align: center; margin-bottom: 25px; color: var(--primary);">Welcome Back</h2>
        
        <input type="number" id="login-mobile" placeholder="📱 Enter Mobile Number">
        <input type="password" id="login-password" placeholder="🔒 Enter Password">
        
        <div class="captcha-box">
            <span id="login-captcha-text" style="font-weight: bold; font-size: 20px; color: var(--primary);"></span>
            <input type="number" id="login-captcha-input" placeholder="Answer" style="width: 50%; margin: 0; text-align: center;">
        </div>
        
        <button id="login-btn" style="margin-top: 25px; font-weight: bold; padding: 14px;">Secure Login</button>
        <div class="toggle-link" onclick="toggleAuth()">New User? Create Account Here</div>
    </div>

    <!-- REGISTER BOX -->
    <div class="auth-container" id="register-box" style="display: none;">
        <div style="text-align: center; margin-bottom: 10px;">
            <img src="images/default-logo.png" alt="Logo" width="70" style="border-radius: 50%;">
        </div>
        <h2 style="text-align: center; margin-bottom: 20px; color: var(--primary);">Register</h2>
        
        <input type="text" id="reg-name" placeholder="👤 Full Name">
        <input type="date" id="reg-dob" placeholder="📅 DOB">
        <input type="number" id="reg-mobile" placeholder="📱 Mobile Number (For Login)">
        <input type="password" id="reg-pass" placeholder="🔒 Password">
        <input type="password" id="reg-confirm-pass" placeholder="🔒 Confirm Password">
        
        <button id="register-btn" style="margin-top: 20px; font-weight: bold; padding: 14px;">Register Now</button>
        <div class="toggle-link" onclick="toggleAuth()">Already registered? Login Here</div>
    </div>

    <script>
        // Theme toggle logic (Save in LocalStorage so it stays when page reloads)
        function toggleTheme() { 
            document.body.classList.toggle('dark-mode'); 
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        // Toggle Login / Register form
        function toggleAuth() {
            const login = document.getElementById('login-box');
            const reg = document.getElementById('register-box');
            if(login.style.display === 'none') { 
                login.style.display = 'block'; 
                reg.style.display = 'none'; 
            } else { 
                login.style.display = 'none'; 
                reg.style.display = 'block'; 
            }
        }
    </script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
